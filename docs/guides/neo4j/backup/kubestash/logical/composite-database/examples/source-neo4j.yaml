apiVersion: kubedb.com/v1alpha2
kind: Neo4j
metadata:
  name: source-neo4j
  namespace: demo
spec:
  version: 2025.12.1
  replicas: 3
  configuration:
    remoteAliasKeystore:
      keystoreRef:
        name: neo4j-remote-alias-keystore
        key: aes
      passwordRef:
        name: neo4j-remote-alias-keystore
        key: password
      keyName: neo
  storageType: Durable
  storage:
    accessModes:
      - ReadWriteOnce
    resources:
      requests:
        storage: 2Gi
  deletionPolicy: WipeOut
