apiVersion: kubedb.com/v1
kind: Postgres
metadata:
  name: pg-mig
  namespace: demo
spec:
  remoteReplica:
    sourceRef:
      name: source-pg          # the AppBinding above, in THIS cluster
      namespace: demo
  authSecret:
    name: source-pg-auth       # during the warm phase: the migration user's credentials
  healthChecker:
    disableWriteCheck: true
  clientAuthMode: md5
  standbyMode: Hot
  replicas: 1
  storage:
    accessModes: [ReadWriteOnce]
    resources:
      requests:
        storage: 10Gi          # must hold the full source database plus WAL
  storageType: Durable
  deletionPolicy: Halt
  version: "17.4"              # must match the source's MAJOR version
