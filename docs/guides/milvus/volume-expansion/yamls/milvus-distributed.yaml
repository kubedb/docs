apiVersion: kubedb.com/v1alpha2
kind: Milvus
metadata:
  name: milvus-cluster
  namespace: demo
spec:
  version: "2.6.11"
  objectStorage:
    configSecret:
      name: "milvus-cluster-storage-config"
  topology:
    mode: Distributed
    distributed:
      streamingnode:
        replicas: 2
        storageType: Durable
        storage:
          accessModes:
            - ReadWriteOnce
          storageClassName: longhorn-custom
          resources:
            requests:
              storage: 1Gi
