apiVersion: v1
kind: Secret
metadata:
  name: milvus-object-storage
  namespace: demo
type: Opaque
stringData:
  # every key overrides the same key under minio: in milvus.yaml
  address: s3.example.internal
  port: "443"
  useSSL: "true"
  bucketName: milvus-data
  rootPath: files
  useIAM: "false"
  cloudProvider: aws
  region: us-east-1
  accessKeyID: <access-key>
  secretAccessKey: <secret-key>
