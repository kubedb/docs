apiVersion: kubedb.com/v1alpha2
kind: Etcd
metadata:
  name: restored-etcd
  namespace: demo
spec:
  version: "3.6.4"
  replicas: 3
  storageType: Durable
  storage:
    accessModes:
      - ReadWriteOnce
    resources:
      requests:
        storage: 1Gi
  init:
    archiver:
      recoveryTimestamp: "0001-01-01T00:00:00Z"
      encryptionSecret:
        name: encrypt-secret
        namespace: demo
      fullDBRepository:
        name: sample-etcd-full
        namespace: demo
      manifestRepository:
        name: sample-etcd-manifest
        namespace: demo
  deletionPolicy: WipeOut
