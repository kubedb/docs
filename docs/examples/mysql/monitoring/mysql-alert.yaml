apiVersion: kubedb.com/v1
kind: MySQL
metadata:
  name: mysql-alert
  namespace: alert-mysql
spec:
  version: "9.6.0"
  deletionPolicy: WipeOut
  replicas: 3
  topology:
    mode: GroupReplication
    group:
      mode: Single-Primary
  storageType: Durable
  storage:
    storageClassName: "longhorn"
    accessModes:
    - ReadWriteOnce
    resources:
      requests:
        storage: 1Gi
  monitor:
    agent: prometheus.io/operator
    prometheus:
      serviceMonitor:
        labels:
          release: prometheus
        interval: 10s
