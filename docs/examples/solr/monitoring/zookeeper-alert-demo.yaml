apiVersion: kubedb.com/v1alpha2
kind: ZooKeeper
metadata:
  name: zoo
  namespace: alert-solr
spec:
  version: "3.8.3"
  replicas: 3
  deletionPolicy: WipeOut
  adminServerPort: 8080
  storage:
    storageClassName: "local-path"
    accessModes:
      - ReadWriteOnce
    resources:
      requests:
        storage: "100Mi"
