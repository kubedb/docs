apiVersion: archiver.kubedb.com/v1alpha1
kind: OracleArchiver
metadata:
  name: oracle-archiver
  namespace: demo
spec:
  pause: false
  databases:
    namespaces:
      from: Same
    selector:
      matchLabels:
        archiver: "true"
  retentionPolicy:
    name: demo-retention
    namespace: demo
  encryptionSecret:
    name: encrypt-secret
    namespace: demo
  fullBackup:
    scheduler:
      schedule: "0 */6 * * *"
      successfulJobsHistoryLimit: 2
      failedJobsHistoryLimit: 2
    sessionHistoryLimit: 3
  incrementalBackup:
    backupInterval: 10m
    archivelogInterval: 1m
  backupStorage:
    ref:
      name: s3-storage
      namespace: demo
  deletionPolicy: Retain
