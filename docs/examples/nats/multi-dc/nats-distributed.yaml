apiVersion: kubedb.com/v1alpha2
kind: NATS
metadata:
  name: nats-dc
  namespace: demo
spec:
  version: "2.15.1"
  replicas: 6
  distributed: true
  jetStream:
    storage:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 10Gi
  arbiter:
    replicas: 1
    storage:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
  podTemplate:
    spec:
      podPlacementPolicy:
        name: nats-3dc
  deletionPolicy: WipeOut
