apiVersion: kubedb.com/v1alpha2
kind: NATS
metadata:
  name: nats-monitored
  namespace: demo
spec:
  version: "2.15.1"
  replicas: 3
  monitor:
    agent: prometheus.io/operator
    prometheus:
      serviceMonitor:
        labels:
          release: prometheus
        interval: 10s
  deletionPolicy: WipeOut
