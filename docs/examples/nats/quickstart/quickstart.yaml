apiVersion: kubedb.com/v1alpha2
kind: NATS
metadata:
  name: nats-quickstart
  namespace: demo
spec:
  version: "2.15.1"
  replicas: 3
  jetStream:
    storage:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
      storageClassName: standard
  deletionPolicy: WipeOut
