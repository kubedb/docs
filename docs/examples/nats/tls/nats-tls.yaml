apiVersion: kubedb.com/v1alpha2
kind: NATS
metadata:
  name: nats-tls
  namespace: demo
spec:
  version: "2.15.1"
  replicas: 3
  tls:
    issuerRef:
      apiGroup: cert-manager.io
      kind: Issuer
      name: nats-ca-issuer
    certificates:
      - alias: server
        subject:
          organizations:
            - kubedb
      - alias: client
        subject:
          organizations:
            - kubedb
  deletionPolicy: WipeOut
