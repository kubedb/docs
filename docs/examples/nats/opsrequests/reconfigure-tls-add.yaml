apiVersion: ops.kubedb.com/v1alpha1
kind: NATSOpsRequest
metadata:
  name: nats-add-tls
  namespace: demo
spec:
  type: ReconfigureTLS
  databaseRef:
    name: nats-cluster
  tls:
    issuerRef:
      apiGroup: cert-manager.io
      kind: Issuer
      name: nats-ca-issuer
    certificates:
      - alias: server
        subject:
          organizations:
            - kubedb
  timeout: 30m
  apply: IfReady
