apiVersion: kubedb.com/v1alpha2
kind: Cassandra
metadata:
  name: cassandra-grafana-demo
  namespace: demo
spec:
  version: "5.0.3"
  topology:
    rack:
      - name: r0
        replicas: 3
        storage:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 1Gi
        storageType: Durable
  deletionPolicy: WipeOut
  monitor:
    agent: prometheus.io/operator
    prometheus:
      serviceMonitor:
        labels:
          release: prometheus
        interval: 10s
