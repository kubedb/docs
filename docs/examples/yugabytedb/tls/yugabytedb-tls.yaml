apiVersion: kubedb.com/v1alpha2
kind: YugabyteDB
metadata:
  name: yb-demo
  namespace: demo
spec:
  version: 2025.2.8
  replicationFactor: 3
  topology:
    master:
      podTemplate:
        spec:
          podPlacementPolicy:
            name: spread-across-zones
          containers:
          - name: yb-master
            resources:
              requests: {cpu: 500m, memory: 1Gi}
              limits: {memory: 1Gi}
      storage:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 2Gi}}
    tserver:
      replicas: 3
      podTemplate:
        spec:
          podPlacementPolicy:
            name: spread-across-zones
          containers:
          - name: yb-tserver
            resources:
              requests: {cpu: "1", memory: 2Gi}
              limits: {memory: 2Gi}
      storage:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 5Gi}}
  tls:
    issuerRef:
      apiGroup: cert-manager.io
      kind: Issuer
      name: yb-ca-issuer
  deletionPolicy: WipeOut
