apiVersion: kubedb.com/v1
kind: Postgres
metadata:
  name: pg-enterprise
  namespace: demo
spec:
  version: "16.9-appscode"
  replicas: 1
  license:
    secretRef:
      name: pg-enterprise-license
      key: license.pem
  storage:
    accessModes:
      - ReadWriteOnce
    resources:
      requests:
        storage: 1Gi
    storageClassName: local-path
  deletionPolicy: WipeOut
