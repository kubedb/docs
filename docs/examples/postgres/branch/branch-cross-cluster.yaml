apiVersion: courier.kubedb.com/v1alpha1
kind: Branch
metadata:
  name: pg-cross
  namespace: demo
spec:
  source:
    databaseRef:
      apiGroup: kubedb.com
      kind: Postgres
      name: prod-pg
    namespace: demo
  target:
    clusterName: target
    namespace: dev
    name: pg-cross
    storageClassName: ceph-rbd
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
  deletionPolicy: Delete
