apiVersion: ops.kubedb.com/v1alpha1
kind: Neo4jOpsRequest
metadata:
  name: neo4j-reconfigure-dynamic
  namespace: demo
spec:
  type: Reconfigure
  databaseRef:
    name: neo4j-test
  configuration:
    restart: "false"
    applyConfig:
      db.checkpoint.interval.time: "30m"
  timeout: 5m
  apply: IfReady
