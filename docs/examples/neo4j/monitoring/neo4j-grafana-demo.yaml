apiVersion: kubedb.com/v1alpha2
kind: Neo4j
metadata:
  name: neo4j-grafana-demo
  namespace: demo
spec:
  version: "2026.06.0"
  replicas: 3
  deletionPolicy: WipeOut
  storage:
    storageClassName: "standard"
    accessModes:
      - ReadWriteOnce
    resources:
      requests:
        storage: 2Gi
  monitor:
    agent: prometheus.io/operator
    prometheus:
      serviceMonitor:
        labels:
          release: prometheus
        interval: 10s
