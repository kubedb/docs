apiVersion: v1
kind: Secret
metadata:
  name: dw-custom-config
  namespace: demo
stringData:
  dynamic_config.yaml: |
    history.persistenceMaxQPS:
    - value: 3000
---
apiVersion: kubedb.com/v1alpha2
kind: DurableWorkflow
metadata:
  name: temporal-secret-config
  namespace: demo
spec:
  version: temporal-1.32.1
  topology:
    frontend:
      replicas: 2
    history:
      replicas: 2
    matching:
      replicas: 2
    worker:
      replicas: 2
  persistence:
    default:
      name: pg
      namespace: demo
  configuration:
    secretName: dw-custom-config
  deletionPolicy: WipeOut
