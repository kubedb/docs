apiVersion: v1
kind: Secret
metadata:
  name: dw-new-store-password
  namespace: demo
type: kubernetes.io/basic-auth
stringData:
  username: dw_temporal
  password: change-me-too
---
apiVersion: ops.kubedb.com/v1alpha1
kind: DurableWorkflowOpsRequest
metadata:
  name: dw-rotate-auth-secret
  namespace: demo
spec:
  type: RotateAuth
  databaseRef:
    name: temporal
  authentication:
    secretRef:
      kind: Secret
      name: dw-new-store-password
