apiVersion: kubedb.com/v1alpha2
kind: DurableWorkflow
metadata:
  name: temporal-authz
  namespace: demo
spec:
  version: temporal-1.32.1
  topology:
    frontend:
      replicas: 2
    history:
      replicas: 2
    matching:
      replicas: 2
    worker:
      replicas: 2
    internalFrontend:
      replicas: 2
  persistence:
    default:
      name: pg
      namespace: demo
  authorization:
    jwksURL: https://idp.example.com/.well-known/jwks.json
    permissionsClaimName: permissions
    audience: temporal
  deletionPolicy: WipeOut
