apiVersion: v1
kind: Secret
metadata:
  name: temporal-jwks
  namespace: demo
stringData:
  jwks.json: |
    {"keys": [{"kty": "RSA", "alg": "RS256", "use": "sig", "kid": "example", "n": "REPLACE-WITH-BASE64URL-MODULUS", "e": "AQAB"}]}
---
apiVersion: kubedb.com/v1alpha2
kind: DurableWorkflow
metadata:
  name: temporal-authz-key
  namespace: demo
spec:
  version: temporal-1.32.1
  topology:
    frontend:
      replicas: 2
    history:
      replicas: 2
    matching:
      replicas: 2
    worker:
      replicas: 2
    internalFrontend:
      replicas: 2
  persistence:
    default:
      name: pg
      namespace: demo
  authorization:
    publicKeySecret:
      name: temporal-jwks
  deletionPolicy: WipeOut
