apiVersion: kubedb.com/v1alpha2
kind: DurableWorkflow
metadata:
  name: temporal-tls
  namespace: demo
spec:
  version: temporal-1.32.1
  topology:
    frontend:
      replicas: 2
    history:
      replicas: 2
    matching:
      replicas: 2
    worker:
      replicas: 2
  persistence:
    default:
      name: pg
      namespace: demo
  tls:
    issuerRef:
      apiGroup: cert-manager.io
      kind: Issuer
      name: dw-ca-issuer
    certificates:
    - alias: frontend
      duration: 2160h
      renewBefore: 360h
  adminTools:
    enabled: true
  deletionPolicy: WipeOut
